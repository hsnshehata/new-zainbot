<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle for App Icon -->
  <rect width="512" height="512" rx="128" fill="#0A0F1D" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Smart Conversation Flow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="240 100" />
  
  <!-- Dynamic Z / ZainBot Monogram Mesh -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Dynamic Beam -->
    <path d="M 140 160 L 360 160 C 375 160, 385 175, 375 190 L 340 230 L 190 230 C 170 230, 160 215, 170 200 Z" fill="url(#brandGrad)" />
    
    <!-- Central Diagonal Lightning / Conversion Flow Path -->
    <path d="M 360 170 L 165 340 C 150 355, 160 380, 180 380 L 372 380 C 388 380, 396 362, 385 350 L 350 310 L 220 310 L 375 180 Z" fill="url(#brandGrad)" />
  </g>

  <!-- Pulsing AI Node / Zain Dot (نقطة حرف الزاي الذكية) -->
  <circle cx="360" cy="120" r="28" fill="#22D3EE" filter="url(#glow)" />
  <circle cx="360" cy="120" r="16" fill="#FFFFFF" />

  <!-- Bottom Forward Arrow Accent (نمو المبيعات) -->
  <circle cx="150" cy="380" r="14" fill="#8B5CF6" filter="url(#glow)" />
</svg>
