<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="100%" height="100%">
  <defs>
    <linearGradient id="enBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="enGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(40, 20) scale(0.31)">
    <rect width="512" height="512" rx="128" fill="#0A0F1D" />
    <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#enBrandGrad)" stroke-width="3" stroke-opacity="0.5" />
    <circle cx="256" cy="256" r="180" fill="none" stroke="#22D3EE" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round" stroke-dasharray="240 100" />
    <g filter="url(#enGlow)">
      <path d="M 140 160 L 360 160 C 375 160, 385 175, 375 190 L 340 230 L 190 230 C 170 230, 160 215, 170 200 Z" fill="url(#enBrandGrad)" />
      <path d="M 360 170 L 165 340 C 150 355, 160 380, 180 380 L 372 380 C 388 380, 396 362, 385 350 L 350 310 L 220 310 L 375 180 Z" fill="url(#enBrandGrad)" />
    </g>
    <circle cx="360" cy="120" r="28" fill="#22D3EE" filter="url(#enGlow)" />
    <circle cx="360" cy="120" r="16" fill="#FFFFFF" />
  </g>

  <!-- English Typography Text -->
  <text x="240" y="105" font-family="'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
    Zain<tspan fill="url(#enBrandGrad)">Bot</tspan>
  </text>
  <text x="460" y="75" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#06B6D4" letter-spacing="2">
    AI
  </text>
  <text x="240" y="145" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    Autonomous Sales &amp; Growth Engine
  </text>
</svg>
